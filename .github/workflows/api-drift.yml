name: API drift
on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build tools
        run: |
          go build -o "$RUNNER_TEMP/conformdiff" ./cmd/conformdiff
          go build -o "$RUNNER_TEMP/api-drift" ./scripts/api-drift
      - name: Check upstream APIs
        id: drift
        continue-on-error: true
        run: |
          set -o pipefail
          "$RUNNER_TEMP/api-drift" -conformdiff "$RUNNER_TEMP/conformdiff" -out "$RUNNER_TEMP/api-drift.md" 2>&1 | tee "$RUNNER_TEMP/api-drift.log"
      - name: Report drift or failed check
        if: always() && steps.drift.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          if [ "$DRIFT_OUTCOME" != success ]; then
            title='API drift check failed'
            { echo 'The scheduled API drift check failed. See the workflow run for details.'; echo; echo '```'; cat "$RUNNER_TEMP/api-drift.log"; echo '```'; } > "$RUNNER_TEMP/issue.md"
          elif [ -s "$RUNNER_TEMP/api-drift.md" ]; then
            title='API endpoint drift detected'
            cp "$RUNNER_TEMP/api-drift.md" "$RUNNER_TEMP/issue.md"
          else
            exit 0
          fi
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Fail when check failed
        if: steps.drift.outcome == 'failure'
        run: exit 1
