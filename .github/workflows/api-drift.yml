name: API drift
on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: drift-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the drift branch
      pull-requests: write # open or update the drift pull request
      issues: write # report a failed check
    steps:
      # Keeps the token in git config: scripts/drift-watch.sh pushes the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Plan endpoint drift and reference image bumps
        id: plan
        continue-on-error: true
        env:
          DRIFT_WATCH_SKIP_RECORD: "1"
        run: scripts/drift-watch.sh plan
      - name: Open or update the drift pull request
        if: steps.plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_PR_BASE: prism
          DRIFT_WATCH_OPEN_PR: "1"
          DRIFT_WATCH_SKIP_RECORD: "1"
        run: scripts/drift-watch.sh pr
      - name: Report a failed check
        if: steps.plan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='API drift check failed'
          printf '%s\n' 'The scheduled API drift check failed before it could open a pull request. See the workflow run for details.' > "$RUNNER_TEMP/issue.md"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Fail when the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
