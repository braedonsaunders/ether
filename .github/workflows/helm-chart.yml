name: Helm chart
on:
  pull_request:
    paths: ["packaging/helm/**", "packaging/kubernetes/**", "docs/kubernetes*", ".github/workflows/helm-chart.yml"]
  push:
    paths: ["packaging/helm/**", "packaging/kubernetes/**", "docs/kubernetes*", ".github/workflows/helm-chart.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint packaging/helm/ether --strict -f packaging/kubernetes/mixed-cpu.values.yaml
      - run: python packaging/kubernetes/check-chart.py
      - run: python packaging/kubernetes/check-rollout.py
      - run: python packaging/kubernetes/check-placement.py
      - run: python packaging/kubernetes/check-fresh-baseline.py
      - run: python packaging/kubernetes/check-plex-baseline.py
      - run: helm package packaging/helm/ether --destination dist/charts
      - uses: actions/upload-artifact@v4
        with:
          name: ether-helm-chart
          path: dist/charts/*.tgz
