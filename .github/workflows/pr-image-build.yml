name: PR image build

# Runs untrusted PR code: read-only token, uses no secrets and no registry
# credentials. The only output is an OCI archive, which Publish PR image
# treats as data.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-image-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR preview image
    # Saves runner time only; this file comes from the PR, so it is not a
    # security check. The publisher re-checks the live PR and author.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Stage ffmpeg
        run: |
          scripts/fetch-ffmpeg.sh linux-amd64
      - name: Build image without registry credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "VERSION=pr-${PR_NUMBER}" --build-arg "COMMIT=${HEAD_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=pr-${PR_NUMBER}" \
            --label "org.opencontainers.image.description=Unreviewed preview of Ether PR #${PR_NUMBER}" \
            --output type=oci,dest=pr-image.tar .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-image
          path: pr-image.tar
          retention-days: 1
          compression-level: 0
