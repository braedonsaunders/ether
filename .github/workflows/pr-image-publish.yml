name: Publish PR image

on:
  # PR code runs in the separate, read-only PR image build workflow. This
  # workflow always runs from the default branch: it checks the live PR, then
  # copies the build's OCI archive to pr-* tags as data. Nothing from the
  # artifact or the PR is ever executed here.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [PR image build]
    types: [completed]

permissions: {}

# One publisher per PR head branch: runs for the same PR are serialized, and a
# newer pending run replaces an older one, whose head would be stale anyway.
# Different PRs never wait on each other.
concurrency:
  group: pr-image-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish PR preview image
    # The workflows filter matches by name only, and a PR can add any workflow
    # with that name, so also pin the triggering file.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/pr-image-build.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # download the build run's artifact
      packages: write # push pr-* tags to ghcr.io
      pull-requests: read # check the live PR head and author
    steps:
      - name: Install OCI transport
        run: command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
      - name: Validate PR and publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          owner=${HEAD_REPO%%/*}
          # Fork workflow runs have an empty pull_requests array. Match all
          # three head fields from GitHub's run record against the live PR,
          # never anything inside the artifact.
          prs=$(gh api --method GET --paginate "repos/$REPO/pulls" \
            -f state=open -f "head=$owner:$HEAD_BRANCH" -f per_page=100 \
            | jq -s 'add')
          pr=$(jq -c --arg repo "$HEAD_REPO" --arg branch "$HEAD_BRANCH" --arg sha "$HEAD_SHA" \
            '[.[] | select(.head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha)] | if length == 1 then .[0] else empty end' <<<"$prs")
          if [ -z "$pr" ]; then echo 'No unique open PR with this current head'; exit 0; fi
          number=$(jq -r '.number' <<<"$pr")
          author=$(jq -r '.user.login' <<<"$pr")
          [[ "$number" =~ ^[1-9][0-9]{0,8}$ ]]

          # Eligible: the PR is still open at exactly this head, its author
          # currently has write access or above (author_association also
          # admits read-only collaborators), and the head branch lives in this
          # repository or in the author's own fork, so nobody else can push
          # commits to it. Checked again right before every registry write.
          current() {
            local live permission
            live=$(gh api "repos/$REPO/pulls/$number")
            jq -e --arg repo "$HEAD_REPO" --arg branch "$HEAD_BRANCH" --arg sha "$HEAD_SHA" \
              --arg author "$author" --arg base "$REPO" \
              '.state == "open" and .user.login == $author
                and .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha
                and (.head.repo.full_name == $base or .head.repo.owner.login == $author)' \
              <<<"$live" >/dev/null || return 1
            permission=$(gh api "repos/$REPO/collaborators/$author/permission" --jq '.permission' 2>/dev/null) || return 1
            case "$permission" in admin|maintain|write) return 0 ;; *) return 1 ;; esac
          }
          current || { echo 'PR author is not eligible'; exit 0; }

          slug=$(printf '%s' "$HEAD_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-30 | sed 's/-*$//')
          [ -n "$slug" ] || slug=branch
          image="ghcr.io/${REPO,,}"
          immutable="pr-${number}-${slug}-${HEAD_SHA:0:12}"
          stable="pr-${number}"
          # Only ever write inside the pr-<number> namespace. Release tags
          # (latest, <version>, candidate-<sha>, and their -<arch> forms) can
          # never match.
          [[ "$immutable" =~ ^pr-[0-9]+-[a-z0-9]([a-z0-9-]*[a-z0-9])?-[0-9a-f]{12}$ ]]
          [[ "$stable" =~ ^pr-[0-9]+$ ]]

          gh run download "$RUN_ID" --repo "$REPO" --name pr-image --dir image
          test -f image/pr-image.tar && test ! -L image/pr-image.tar
          source="oci-archive:image/pr-image.tar"
          skopeo inspect --raw "$source" > archive-manifest
          want=$(skopeo manifest-digest archive-manifest)

          printf '%s' "$GH_TOKEN" | skopeo login --username "$ACTOR" --password-stdin ghcr.io
          # A rebuild of the same commit is not byte-identical, so an existing
          # immutable tag is kept as is and only the moving tag is updated.
          if skopeo inspect --raw "docker://$image:$immutable" > pushed-manifest 2> inspect-error; then
            echo "Keeping existing $image:$immutable"
          elif ! grep -Eqi 'manifest unknown|manifest_unknown|name unknown|name_unknown' inspect-error; then
            cat inspect-error >&2; exit 1
          else
            current || { echo 'PR changed or author is no longer eligible'; exit 0; }
            skopeo copy --all --preserve-digests "$source" "docker://$image:$immutable"
            skopeo inspect --raw "docker://$image:$immutable" > pushed-manifest
            got=$(skopeo manifest-digest pushed-manifest)
            if [ "$got" != "$want" ]; then
              echo "Pushed digest $got does not match archive digest $want" >&2; exit 1
            fi
          fi
          digest=$(skopeo manifest-digest pushed-manifest)
          current || { echo 'PR changed or author is no longer eligible'; exit 0; }
          # Move the PR tag by digest, so it can only point at what was verified.
          skopeo copy --all --preserve-digests "docker://$image@$digest" "docker://$image:$stable"
          echo "Published $image:$stable and $image:$immutable ($digest)"
          {
            echo "### PR #$number preview image"
            echo
            echo "Unreviewed PR code. Only run it if you trust the author."
            echo
            echo "- \`$image:$stable\`"
            echo "- \`$image:$immutable\`"
            echo "- \`$image@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
